<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selah — 성경, 기도, 찬송을 한 앱에서. 새벽기도, 큐티, 가족예배를 더욱 풍성하게.">
  <title>Selah — 새벽 기도가 더욱 깊어집니다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream:   #fdfaf5;
      --cream2:  #f5f0e8;
      --cream3:  #ede5d8;
      --dark:    #1c1410;
      --dark2:   #2e2318;
      --gold:    #b8790a;
      --gold2:   #d4950e;
      --gold3:   #8a5c08;
      --gold-lt: #f5e4b8;
      --gold-bd: rgba(184,121,10,0.25);
      --text:    #1c1410;
      --text2:   #6b5d4f;
      --text3:   #a09080;
      --serif:   'Libre Baskerville','Noto Serif KR',Georgia,serif;
      --sans:    'Noto Sans KR','Noto Sans',sans-serif;
      --r: 14px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--text); font-family: var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ── TOP ANNOUNCEMENT BAR ── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      background: var(--gold);
      padding: 11px 48px 11px 24px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-family: var(--sans); font-size: 0.82rem; font-weight: 700;
      color: #1a0800; letter-spacing: 0.01em;
      transition: transform 0.35s ease;
      cursor: pointer;
    }
    #top-bar.gone { transform: translateY(-100%); }
    #top-bar:hover { background: var(--gold2); }
    .tb-dot { width: 6px; height: 6px; background: #1a0800; border-radius: 50%; opacity: 0.5; flex-shrink: 0; animation: bdot 1.5s ease-in-out infinite; }
    .tb-arrow { font-size: 0.9rem; opacity: 0.7; transition: transform .2s; }
    #top-bar:hover .tb-arrow { transform: translateX(3px); }
    .tb-close {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(26,8,0,0.45); cursor: pointer;
      font-size: 1.1rem; padding: 4px 8px; line-height: 1;
    }
    .tb-close:hover { color: rgba(26,8,0,0.75); }

    /* ── FLOATING BANNER ── */
    .float-banner {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: var(--dark); border-top: 2px solid var(--gold);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      transform: translateY(110%); transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    }
    .float-banner.show { transform: translateY(0); }
    .fb-left { flex: 1; }
    .fb-strong { font-size: 0.88rem; font-weight: 600; color: #fff; margin-bottom: 2px; font-family: var(--sans); }
    .fb-sub { font-size: 0.72rem; color: rgba(255,255,255,0.55); }
    .fb-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .fb-btn { background: var(--gold2); color: #fff; font-family: var(--sans); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; padding: 10px 22px; border-radius: 6px; border: none; cursor: pointer; transition: all .25s; white-space: nowrap; }
    .fb-btn:hover { background: var(--gold); transform: translateY(-1px); }
    .fb-close { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 1.2rem; padding: 4px; line-height: 1; }
    .fb-close:hover { color: rgba(255,255,255,0.7); }

    /* ── NAV ── */
    nav {
      position: fixed; top: 40px; left: 0; right: 0; z-index: 100;
      transition: top 0.35s ease;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 40px;
      background: rgba(253,250,245,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--cream3);
      gap: 16px;
    }
    .nav-logo {
      font-family: var(--serif); font-size: 1.3rem; font-weight: 700;
      color: var(--gold); letter-spacing: 0.06em; text-decoration: none;
      display: flex; align-items: center; gap: 9px; flex-shrink: 0;
    }
    .nav-cross { display: flex; align-items: center; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .lang-switcher { display: flex; gap: 3px; }
    .lang-btn {
      background: none; border: 1px solid transparent;
      color: var(--text3); font-family: var(--sans);
      font-size: 0.68rem; font-weight: 600; padding: 5px 9px;
      border-radius: 5px; cursor: pointer; transition: all .2s;
    }
    .lang-btn:hover { color: var(--text2); border-color: var(--cream3); }
    .lang-btn.on { color: var(--gold); border-color: var(--gold-bd); background: var(--gold-lt); }
    .nav-cta {
      font-family: var(--sans); font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.05em; color: #fff; background: var(--gold2);
      padding: 10px 22px; border-radius: 6px; cursor: pointer;
      transition: all .25s; text-decoration: none; border: none; white-space: nowrap;
    }
    .nav-cta:hover { background: var(--gold); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184,121,10,0.3); }

    /* ── HERO ── */
    #hero {
      min-height: 100svh; position: relative;
      display: flex; align-items: flex-end;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0; overflow: hidden;
    }
    .hero-bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }
    @media (max-width: 767px) {
      .hero-bg img { object-position: 45% 30%; }
    }
    .hero-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(28,20,16,0.25) 0%,
        rgba(28,20,16,0.20) 35%,
        rgba(28,20,16,0.65) 72%,
        rgba(28,20,16,0.92) 100%
      );
    }
    .hero-content {
      position: relative; z-index: 1;
      width: 100%; padding: 80px 60px 72px;
      color: #fff;
    }
    /* 히어로 중앙 성경구절 */
    .hero-verse-center {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1; width: 100%;
      max-width: 700px;
      padding: 0 28px;
      text-align: center;
      pointer-events: none;
    }
    .hero-verse {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(1rem, 2.6vw, 1.45rem); font-weight: 600;
      color: rgba(255,255,255,0.95); margin-bottom: 10px;
      line-height: 1.6;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      word-break: keep-all; overflow-wrap: break-word;
    }
    .hero-ref {
      font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--gold2); opacity: 0.9;
    }

    /* 히어로 배지 — 강조 */
    .hero-badge {
      display: inline-block; font-family: var(--sans);
      font-size: clamp(0.75rem, 2vw, 0.88rem);
      font-weight: 500; letter-spacing: 0.03em;
      color: #fff; background: var(--gold);
      padding: 9px 20px; border-radius: 4px; margin-bottom: 16px;
      word-break: keep-all; white-space: normal; line-height: 1.4;
      max-width: 100%;
    }
    .hero-h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 6vw, 5.5rem);
      font-weight: 700; line-height: 1.12;
      color: #fff; margin-bottom: 28px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      word-break: keep-all; overflow-wrap: break-word;
    }
    .hero-h1 em { font-style: italic; color: var(--gold2); }
    .hero-form-row {
      display: flex; gap: 10px; flex-wrap: wrap; max-width: 500px;
    }
    .hero-form-row input[type=email] {
      flex: 1; min-width: 200px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-family: var(--sans); font-size: 0.9rem;
      padding: 14px 20px; border-radius: 6px; outline: none;
      backdrop-filter: blur(8px); transition: all .3s;
    }
    .hero-form-row input::placeholder { color: rgba(255,255,255,0.55); }
    .hero-form-row input:focus { border-color: var(--gold2); background: rgba(255,255,255,0.22); }
    .btn-primary {
      background: var(--gold2); color: #fff;
      font-family: var(--sans); font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.05em; padding: 14px 28px;
      border-radius: 6px; border: none; cursor: pointer;
      transition: all .25s; white-space: nowrap;
    }
    .btn-primary:hover { background: var(--gold); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(184,121,10,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .hero-note { font-family: var(--sans); font-size: 0.67rem; color: rgba(255,255,255,0.5); margin-top: 12px; }
    .hero-success { display:none; padding:14px 20px; background:rgba(212,149,14,0.15); border:1px solid rgba(212,149,14,0.4); border-radius:8px; color:var(--gold2); font-size:0.88rem; font-family:var(--sans); max-width:460px; margin-top:10px; }

    /* 사전 신청자 혜택 */
    .hero-benefit {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--sans); font-size: 0.73rem; font-weight: 500;
      color: rgba(255,255,255,0.75);
      margin-bottom: 20px;
    }
    .hero-benefit strong { font-weight: 700; color: var(--gold2); }
    .benefit-dot { width: 6px; height: 6px; background: var(--gold2); border-radius: 50%; flex-shrink: 0; animation: bdot 2s ease-in-out infinite; }
    @keyframes bdot { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* 대기자 카운터 */
    .hero-counter {
      font-family: var(--sans); font-size: 0.75rem;
      color: rgba(255,255,255,0.6); margin-top: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .counter-num {
      font-family: var(--serif); font-size: 1.05rem; font-weight: 700;
      color: var(--gold2);
    }

    /* ── 기도 도우미 스포트라이트 ── */
    #prayer-spotlight {
      background: #1c1410;
      padding: 88px 24px;
    }
    .ps-inner {
      max-width: 880px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start;
    }
    @media (max-width: 680px) { .ps-inner { grid-template-columns: 1fr; gap: 40px; } }
    .ps-title {
      font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700; line-height: 1.2; color: #fff; margin-bottom: 14px;
    }
    .ps-title em { font-style: italic; color: var(--gold2); font-weight: 400; }
    .ps-sub {
      font-family: var(--sans); font-size: 0.9rem; color: rgba(255,255,255,0.5);
      line-height: 1.85; margin-bottom: 32px; font-weight: 300;
    }
    .ps-right { display: flex; flex-direction: column; gap: 28px; }
    .ps-card { padding: 0 0 28px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .ps-card:last-child { border-bottom: none; padding-bottom: 0; }
    .ps-card-num {
      font-family: var(--serif); font-size: 0.75rem; font-weight: 700;
      color: var(--gold2); margin-bottom: 8px; letter-spacing: 0.1em;
    }
    .ps-card-title {
      font-family: var(--sans); font-size: 0.9rem; font-weight: 600;
      color: #fff; margin-bottom: 5px;
    }
    .ps-card-desc { font-family: var(--sans); font-size: 0.78rem; color: rgba(255,255,255,0.45); line-height: 1.7; }

    /* ── STATS ── */
    #stats {
      background: #fff; border-bottom: 1px solid var(--cream3);
    }
    .stats-inner {
      max-width: 900px; margin: 0 auto;
      display: flex; flex-wrap: wrap;
    }
    .stat {
      flex: 1; min-width: 140px; padding: 32px 28px;
      text-align: center; border-right: 1px solid var(--cream3);
    }
    .stat:last-child { border-right: none; }
    .stat-n {
      font-family: var(--serif); font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700; color: var(--gold); line-height: 1; margin-bottom: 6px;
    }
    .stat-l { font-family: var(--sans); font-size: 0.72rem; color: var(--text2); line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; }

    /* ── MARQUEE ── */
    #marquee { overflow: hidden; background: var(--gold2); padding: 14px 0; }
    .mq-track { display: flex; gap: 48px; white-space: nowrap; animation: mq 26s linear infinite; }
    .mq-track:hover { animation-play-state: paused; }
    @keyframes mq { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .mq-item { font-family: var(--sans); font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.06em; flex-shrink: 0; }
    .mq-item b { color: #fff; font-weight: 700; }

    /* ── SECTION SHARED ── */
    .sec-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .sec-label { font-family: var(--sans); font-size: 0.67rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
    .sec-title { font-family: var(--serif); font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 700; line-height: 1.25; margin-bottom: 48px; color: var(--text); word-break: keep-all; overflow-wrap: break-word; }
    .sec-title em { font-style: italic; color: var(--gold); font-weight: 400; }

    /* ── FEATURES ── */
    #features { padding: 90px 24px; background: var(--cream); }
    .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (min-width: 700px) { .feat-grid { grid-template-columns: repeat(4,1fr); } }
    .feat-card {
      background: #fff;
      border-radius: var(--r); overflow: hidden;
      transition: transform .35s cubic-bezier(0.23,1,0.32,1), box-shadow .35s;
      box-shadow: 0 2px 16px rgba(28,20,16,0.07);
    }
    .feat-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(28,20,16,0.11); }
    .feat-img { height: 130px; overflow: hidden; }
    .feat-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
    .feat-card:hover .feat-img img { transform: scale(1.06); }
    .feat-body { padding: 20px 16px 22px; }
    .feat-main { font-family: var(--serif); font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 2px; word-break: keep-all; }
    .feat-sub { font-family: var(--sans); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; word-break: keep-all; }
    .feat-desc { font-family: var(--sans); font-size: 0.74rem; color: var(--text2); line-height: 1.8; word-break: keep-all; overflow-wrap: break-word; }

    /* ── QUOTE (bg4 church photo) ── */
    #quote-section {
      position: relative; padding: 110px 24px; text-align: center; overflow: hidden;
    }
    .quote-bg {
      position: absolute; inset: 0;
      background: url('bg5.jpg') center center / cover no-repeat;
    }
    .quote-bg::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(28,20,16,0.78);
    }
    .quote-inner { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
    .quote-rule { width: 44px; height: 2px; background: var(--gold2); margin: 0 auto 32px; }
    .quote-mark { font-family: var(--serif); font-size: 7rem; line-height: 0.4; color: var(--gold2); opacity: 0.3; display: block; margin-bottom: 28px; }
    blockquote { font-family: var(--serif); font-size: clamp(1.2rem, 3.5vw, 2.4rem); font-weight: 400; font-style: italic; line-height: 1.6; color: #fff; margin-bottom: 24px; word-break: keep-all; overflow-wrap: break-word; }
    blockquote em { color: var(--gold2); font-style: normal; }
    .quote-ref { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

    /* ── TESTIMONIALS (가상 리더) ── */
    #testimonials { padding: 90px 24px; background: #fff; }
    .testi-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 700px) { .testi-grid { grid-template-columns: repeat(3,1fr); } }
    .testi-card {
      background: var(--cream);
      border-radius: var(--r); padding: 32px 28px;
      transition: transform .3s, box-shadow .3s;
    }
    .testi-card:hover { box-shadow: 0 10px 32px rgba(28,20,16,0.08); transform: translateY(-3px); }
    .testi-stars { color: var(--gold2); font-size: 0.85rem; margin-bottom: 18px; letter-spacing: 2px; }
    .testi-quote { font-family: var(--serif); font-size: clamp(0.85rem, 1.5vw, 1rem); font-style: italic; line-height: 1.8; color: var(--text); margin-bottom: 24px; word-break: keep-all; overflow-wrap: break-word; }
    .testi-person { display: flex; align-items: center; gap: 14px; }
    .testi-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg,var(--gold2),var(--gold));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .testi-name { font-family: var(--sans); font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .testi-role { font-family: var(--sans); font-size: 0.72rem; color: var(--text3); }

    /* ── EMOTIONAL (bg5) ── */
    #emotion { position: relative; padding: 110px 24px; text-align: center; overflow: hidden; }
    .emo-bg { position: absolute; inset: 0; background: url('bg5.jpg') center center / cover no-repeat; }
    .emo-bg::after { content: ''; position: absolute; inset: 0; background: rgba(28,20,16,0.75); }
    .emo-inner { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; }
    .emo-title { font-family: var(--serif); font-size: clamp(1.7rem, 4.5vw, 3.2rem); font-weight: 700; line-height: 1.25; color: #fff; margin-bottom: 28px; word-break: keep-all; overflow-wrap: break-word; }
    .emo-title strong { font-style: italic; font-weight: 400; color: var(--gold2); }
    .emo-body { font-family: var(--sans); font-size: clamp(0.85rem, 1.8vw, 0.97rem); color: rgba(255,255,255,0.75); line-height: 2; margin-bottom: 44px; font-weight: 300; word-break: keep-all; overflow-wrap: break-word; }
    .emo-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .emo-tag { font-family: var(--sans); font-size: 0.73rem; color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); padding: 7px 16px; border-radius: 100px; }

    /* ── CTA ── */
    #cta { padding: 90px 24px; background: var(--cream2); }
    .cta-box {
      max-width: 600px; margin: 0 auto; text-align: center;
      background: #fff; border: 1px solid var(--cream3);
      border-radius: 20px; padding: 68px 48px;
      box-shadow: 0 8px 40px rgba(28,20,16,0.08);
    }
    .cta-title { font-family: var(--serif); font-size: clamp(2rem,5vw,2.8rem); font-weight: 700; margin-bottom: 12px; color: var(--text); }
    .cta-sub { font-family: var(--sans); font-size: 0.88rem; color: var(--text2); line-height: 1.8; margin-bottom: 36px; font-weight: 300; }
    .cta-form { display: flex; flex-direction: column; gap: 12px; }
    .cta-form input[type=email] {
      background: var(--cream); border: 1px solid var(--cream3);
      color: var(--text); font-family: var(--sans); font-size: 0.95rem;
      padding: 15px 22px; border-radius: 6px; outline: none;
      text-align: center; transition: all .3s;
    }
    .cta-form input:focus { border-color: var(--gold-bd); background: #fff; box-shadow: 0 0 0 3px rgba(184,121,10,0.08); }
    .cta-form input::placeholder { color: var(--text3); }
    .btn-dark {
      background: var(--dark); color: #fff; font-family: var(--sans);
      font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em;
      padding: 15px; border-radius: 6px; border: none; cursor: pointer;
      transition: all .25s;
    }
    .btn-dark:hover { background: var(--gold); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(184,121,10,0.3); }
    .btn-dark:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .cta-success { display:none; padding:18px; background:var(--gold-lt); border:1px solid var(--gold-bd); border-radius:8px; color:var(--gold3); font-family:var(--sans); font-size:0.88rem; line-height:1.7; }

    /* ── FOOTER ── */
    footer { background: var(--dark2); padding: 44px 24px; text-align: center; }

// ── i18n ────────────────────────────────────────────────────────
let lang = localStorage.getItem('selah-lang') ||
  (navigator.language.startsWith('zh')?'zh':navigator.language.startsWith('ja')?'ja':
   navigator.language.startsWith('es')?'es':navigator.language.startsWith('ko')?'ko':'en');
if (!T[lang]) lang = 'ko';

function setLang(l) {
  lang = l; localStorage.setItem('selah-lang', l);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[l][k] !== undefined) el.innerHTML = T[l][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const k = el.getAttribute('data-i18n-ph');
    if (T[l][k] !== undefined) el.placeholder = T[l][k];
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.getAttribute('data-lang') === l));
  document.documentElement.lang = l;
  buildTags(); buildMarquee();
}

function buildTags() {
  document.getElementById('emoTags').innerHTML = (T[lang].tags||[]).map(t=>`<span class="emo-tag">${t}</span>`).join('');
}
function buildMarquee() {
  const items = T[lang].marquee || T.ko.marquee;
  const doubled = [...items, ...items];
  document.getElementById('mqTrack').innerHTML = doubled.map(t=>`<span class="mq-item">✦ &nbsp;<b>${t}</b></span>`).join('');
}

setLang(lang);

const io = new IntersectionObserver(
  e => e.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }),
  { threshold: 0.12 }
);
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

function handleForm(fId, bId, sId, eId) {
  document.getElementById(fId).addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById(eId).value.trim();
    if (!email) return;
    const btn = document.getElementById(bId), orig = btn.textContent;

(function() {
  const el = document.getElementById('counterNum');
  if (!el) return;
  let count = 3241;
  el.textContent = count.toLocaleString();
  el.style.transition = 'transform 0.15s ease, opacity 0.15s ease';

  function roll() {
    count++;
    el.style.transform = 'translateY(-3px)';
    el.style.opacity = '0.5';
    setTimeout(() => {
      el.textContent = count.toLocaleString();
      el.style.transform = '';
      el.style.opacity = '';
    }, 150);
    // 1~3초 랜덤 간격
    setTimeout(roll, 1000 + Math.random() * 2000);
  }
  // 2초 후 시작
  setTimeout(roll, 2000);
})();

  nav.style.transition = 'top 0.35s ease';
}
</script>
